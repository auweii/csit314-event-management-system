<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Profile</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }

    header {
      background-color: #710261;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .search-location {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      justify-content: center;
      max-width: 500px;
    }

    .search-location input {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 20px;
      font-size: 0.9rem;
      width: 100%;
      max-width: 200px;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 1.5rem;
      margin: 0;
      padding: 0;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    nav a:hover {
      color: #f8f8f8;
    }

    .profile-container {
      max-width: 500px;
      margin: 2rem auto;
      text-align: center;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #800080;
      margin-bottom: 1rem;
    }

    h2 {
      margin-bottom: 1.5rem;
      color: #333;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .save-btn {
      background-color: #800080;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
    }

    .save-btn:hover {
      background-color: #5e005e;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      justify-content: center;
    }

    .input-group label {
      font-weight: 500;
      min-width: 60px;
      text-align: right;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Our logo</div>

    <div class="search-location">
      <input
        type="text"
        placeholder="Search events..."
        style="padding: 0.5rem; border-radius: 6px; border: none; width: 200px;"
      />
      <select name="location" id="location">
        <option value="" disabled selected>Choose location</option>
        <option value="sydney">Sydney</option>
        <option value="melbourne">Melbourne</option>
        <option value="brisbane">Brisbane</option>
        <option value="perth">Perth</option>
        <option value="adelaide">Adelaide</option>
      </select>
    </div>

    <nav>
      <a href="Ohomepage.html">Home</a>
      <a href="#">Events</a>
      <a href="organiser-profile.html">Profile</a>
      <a href="#">My Bookings</a>
    </nav>
  </header>

  <div class="profile-container">
    <img src="data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22120%22%20height%3D%22120%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23cccccc%22%2F%3E%3C%2Fsvg%3E" alt="Profile Picture" class="profile-img">
    <h2>Edit Profile</h2>
    <form id="profileForm"> <div class="input-group">
        <label for="name">Name: </label>
        <input type="text" id="name" name="fullName" placeholder="Name" required> </div>
      <div class="input-group">
        <label for="email">Email: </label>
        <input type="text" id="email" name="email" placeholder="Email" required readonly>
      </div>
      <div class="input-group">
        <label for="password">Password: </label>
        <input type="text" id="password" name="password" placeholder="Password" required>
      </div>
      <div class="input-group">
        <label for="dob">DOB: </label>
        <input type="date" id="dob" name="dob" placeholder="Date of Birth" required>
      </div>
      <div class="input-group">
        <label for="address">Address: </label>
        <input type="text" id="address" name="address" placeholder="Address" required>
      </div>
      <button type="submit" class="save-btn">Save Changes</button>
    </form>

    <script>
      // Get references to input elements and the form
      const nameInput = document.getElementById('name');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const dobInput = document.getElementById('dob');
      const addressInput = document.getElementById('address');
      const profileForm = document.getElementById('profileForm'); // Get the form by its ID

      const organiserEmail = localStorage.getItem('organiserEmail');
      console.log("Email from localStorage:", organiserEmail);

      if (!organiserEmail) {
        alert("No organiser logged in. Redirecting to login.");
        window.location.href = "organiser-login.html";
      } else {
        // --- Code to LOAD Profile Data ---
        fetch(`http://localhost:3000/api/organisers/profile?email=${organiserEmail}`)
          .then(res => {
            if (!res.ok) {
              return res.json().then(errData => {
                throw new Error(errData.message || "Failed to load profile.");
              });
            }
            return res.json();
          })
          .then(data => {
            console.log("Profile data loaded:", data);
            nameInput.value = data.fullName || ''; // Aligned with backend's 'fullName'
            emailInput.value = data.email || '';
            passwordInput.value = data.password || '';
            dobInput.value = data.dob || ''; // Aligned with backend's 'dob'
            addressInput.value = data.address || '';
          })
          .catch(error => {
            console.error('Error loading organiser profile:', error);
            alert("Error loading profile: " + error.message);
          });

        // --- Code to SAVE Profile Changes ---
        profileForm.addEventListener('submit', async function(event) {
          event.preventDefault(); // Stop the form from reloading the page

          const updatedProfile = {
            email: emailInput.value, // Essential for backend to identify which organiser to update
            fullName: nameInput.value, // Send as 'fullName' to match backend
            password: passwordInput.value,
            dob: dobInput.value, // Send as 'dob' to match backend
            address: addressInput.value
          };

          console.log("Attempting to save profile changes:", updatedProfile);

          try {
            const response = await fetch('http://localhost:3000/api/organisers/profile', {
              method: 'PUT', // Use PUT for updates
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(updatedProfile) // Send the data as JSON
            });

            const result = await response.json();

            if (response.ok) {
              alert(result.message); // Show success message
              console.log("Profile updated successfully:", result.organiser);
              // Re-populate form with data returned from backend (e.g., if password was hashed)
              nameInput.value = result.organiser.fullName || '';
              passwordInput.value = result.organiser.password || '';
              dobInput.value = result.organiser.dob || '';
              addressInput.value = result.organiser.address || '';
            } else {
              alert("Failed to update profile: " + (result.message || "Unknown error"));
              console.error("Profile update failed:", result);
            }
          } catch (error) {
            console.error('Network or server error during profile update:', error);
            alert('Could not connect to the server to update profile.');
          }
        });
      }
    </script>
</body>
</html>
