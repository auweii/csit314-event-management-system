<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <title>Event Booking | Home</title>

  <!-- Poppins font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Icons (Font Awesome) -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #f8f8f8;
    }

    header {
      background-color: #710261; /* Dark purple */
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .search-location {
      display: flex;
      gap: 1rem;
      flex: 1;
      justify-content: center;
    }

    .search-location input {
      padding: 0.5rem;
      border-radius: 4px;
      border: none;
      width: 200px;
    }

    .auth-links {
      display: flex;
      gap: 1rem;
    }

    .auth-links a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    nav a:hover {
      color: #f8f8f8;
    }

    /* Hero Section */
    .hero {
      width: 100%;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-section {
      background-image: url('images/hmpg.jpg'); /* Your original background */
      background-size: cover;
      background-position: center;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-section h1 {
      color: white;
      font-size: 3rem;
      font-family: 'Poppins', sans-serif;
      padding: 10px 20px;
      border-radius: 8px;
    }

    /* Categories Section */
    .categories {
      display: flex;
      justify-content: space-around;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .category {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
      text-align: center;
      margin: 20px;
    }

    .category:hover {
      border-color: #6a0dad;
    }

    .category img {
      width: 40px;
      height: 40px;
      margin-bottom: 8px;
    }

    .category p {
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      margin: 0;
    }

    .category i {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #4B0082;
    }

    h2 {
      margin-left: 2rem;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .events {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin: 1rem 2rem;
    }

    .event {
      background-color: white;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      width: 45%;
      min-width: 300px;
    }

    .event h3 {
      margin: 0;
      font-size: 1.1rem;
      color: #333;
    }

    .event p {
      margin: 0.25rem 0;
      color: #666;
      font-size: 0.9rem;
    }

    select {
      padding: 0.5rem;
      border-radius: 4px;
      border: none;
      width: 200px;
      font-family: 'Poppins', sans-serif;
    }

    .events-row {
      display: flex;
      justify-content: space-around;
      gap: 2rem;
      margin: 1rem 2rem;
      flex-wrap: wrap;
    }

    .event-content {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .event-img {
      width: 100px;
      height: 100px;
      border-radius: 8px;
      object-fit: cover;
      border: 2px solid #ccc;
    }

    .circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f2f2f2;
      border: 2px solid #5b5757;
      margin-bottom: 12px;
    }

    .circle i {
      font-size: 40px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">Our logo</div>

    <div class="search-location">
      <input
        type="text"
        placeholder="Search events..."
        style="padding: 0.5rem; border-radius: 6px; border: none; width: 200px;"
      />
      <select name="location" id="location">
        <option value="" disabled selected>Choose location</option>
        <option value="sydney">Sydney</option>
        <option value="melbourne">Melbourne</option>
        <option value="brisbane">Brisbane</option>
        <option value="perth">Perth</option>
        <option value="adelaide">Adelaide</option>
      </select>
    </div>

    <nav>
      <a href="homepage.html">Home</a>
      <a href="#">Events</a>
      <a href="profile.html">Profile</a>
      <a href="#">My Bookings</a>
      <a href="register.html">Sign Up</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <!-- Hero Image -->
  <section class="hero">
    <div class="hero-section">
      <h1>Events Everywhere</h1>
    </div>
  </section>

  <!-- Categories -->
  <div class="categories">
    <div class="category">
      <div class="circle">
        <i class="fas fa-music"></i>
      </div>
      <p>Music</p>
    </div>
    <div class="category">
      <div class="circle">
        <i class="fas fa-book"></i>
      </div>
      <p>Educational</p>
    </div>
    <div class="category">
      <div class="circle">
        <i class="fas fa-basketball-ball"></i>
      </div>
      <p>Sports</p>
    </div>
    <div class="category">
      <div class="circle">
        <i class="fas fa-cogs"></i>
      </div>
      <p>Technology</p>
    </div>
    <div class="category">
      <div class="circle">
        <i class="fas fa-plane"></i>
      </div>
      <p>Travel</p>
    </div>
    <div class="category">
      <div class="circle">
        <i class="fas fa-utensils"></i>
      </div>
      <p>Food</p>
    </div>
  </div>

  <!-- Popular Events -->
  <h2>Popular Events</h2>
  <div class="events-row">
    <div class="event">
      <div class="event-content">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=100&q=60" alt="Jazz Night" class="event-img">
        <div class="event-info">
          <h3>Live Jazz Night</h3>
          <p>⏰ 7:00 PM, April 25</p>
          <p>📍 Melbourne Music Hall</p>
        </div>
      </div>
    </div>

    <div class="event">
      <div class="event-content">
        <img src="https://images.unsplash.com/photo-1551836022-4c4c79ecde28?auto=format&fit=crop&w=100&q=60" alt="Tech Expo" class="event-img">
        <div class="event-info">
          <h3>Tech Futures Expo</h3>
          <p>⏰ 10:00 AM, May 5</p>
          <p>📍 Sydney Convention Centre</p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
