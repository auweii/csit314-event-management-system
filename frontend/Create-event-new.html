<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create a New Event</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <div class="logo">Our logo</div>
    <input type="text" placeholder="Search events..." class="search-bar" />
    <select class="location-select">
      <option>Choose location</option>
      <option>New York</option>
      <option>London</option>
      <option>Sydney</option>
    </select>
    <nav class="nav-links">
      <a href="#">Home</a>
      <a href="#">Events</a>
      <a href="#">Profile</a>
      <a href="#">My Bookings</a>
      <a href="#">Sign Up</a>
      <a href="#">Login</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <div class="form-container">
      <h2>Create a New Event</h2>
      <h3>Date & Time</h3>

      <form>
        <div class="form-group triple">
          <div>
            <label for="start-date">Start Date<span>*</span></label>
            <input type="date" id="start-date" required>
          </div>
          <div>
            <label for="start-time">Start Time<span>*</span></label>
            <input type="time" id="start-time" required>
          </div>
          <div>
            <label for="end-time">End Time</label>
            <input type="time" id="end-time">
          </div>
        </div>

        <div class="form-group">
          <label for="sessions">Session(s)<span>*</span></label>
          <input type="text" id="sessions" required placeholder="e.g. Session 1, Session 2">
        </div>

        <div class="form-group">
          <label for="location">Location</label>
          <select id="location">
            <option>Please select one</option>
            <option>Online</option>
            <option>On-site</option>
          </select>
        </div>

        <div class="form-group">
          <label for="info">Additional Information<span>*</span></label>
          <textarea id="info" rows="4" placeholder="Tell people more about your event..." required></textarea>
        </div>

        <button type="submit">Save & Continue</button>
      </form>
    </div>
  </main>
</body>
</html>
