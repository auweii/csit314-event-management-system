<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Profile</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }

    header {
        background-color: #710261; 
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 2rem;
        flex-wrap: wrap;
      }
      

    .logo {
        font-size: 1.5rem;
        font-weight: 600;
      }
      .search-location {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex: 1;
        justify-content: center;
        max-width: 500px;
      }
      .search-location input {
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 20px;
        font-size: 0.9rem;
        width: 100%;
        max-width: 200px;
      }
    nav ul {
      display: flex;
      list-style: none;
      gap: 1.5rem;
      margin: 0;
      padding: 0;
    }

    nav {
        display: flex;
        align-items: center;
        gap: 2rem;
      }
  
      nav a {
        color: white;
        text-decoration: none;
        font-weight: 600;
      }
  
      nav a:hover {
        color: #f8f8f8;
      }

    .profile-container {
      max-width: 500px;
      margin: 2rem auto;
      text-align: center;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #800080;
      margin-bottom: 1rem;
    }

    h2 {
      margin-bottom: 1.5rem;
      color: #333;
    }

    input {
        width: 100%;
        padding: 0.75rem;
        margin-bottom: 1rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
      }

    .save-btn {
      background-color: #800080;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
    }

    .save-btn:hover {
      background-color: #5e005e;
    }
    .input-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
        justify-content: center; /* optional: center horizontally */
      }
      
      .input-group label {
        font-weight: 500;
        min-width: 60px;
        text-align: right;
      }
      
  </style>
</head>
<body>

  <header>
    <div class="logo">Our logo</div>

    <div class="search-location">
      <input
        type="text"
        placeholder="Search events..."
        style="padding: 0.5rem; border-radius: 6px; border: none; width: 200px;"
      />
      <select name="location" id="location">
        <option value="" disabled selected>Choose location</option>
        <option value="sydney">Sydney</option>
        <option value="melbourne">Melbourne</option>
        <option value="brisbane">Brisbane</option>
        <option value="perth">Perth</option>
        <option value="adelaide">Adelaide</option>
      </select>
    </div>

    <nav>
      <a href="homepage.html">Home</a>
      <a href="#">Events</a>
      <a href="profile.html">Profile</a>
      <a href="#">My Bookings</a>
      <a href="register.html">Sign Up</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <div class="profile-container">
    <img src="https://via.placeholder.com/120" alt="Profile Picture" class="profile-img">
    <h2>Edit Profile</h2>
    <form>
        <div class="input-group">
            <label for="name">Name: </label>
            <input type="text" id="name" name="name"placeholder="Name" required>
          </div>
          <div class="input-group">
            <label for="email">Email: </label>
            <input type="text" id="email" name="email"placeholder="Email" required>
          </div>
          <div class="input-group">
            <label for="password">Password: </label>
            <input type="text" id="password" name="password"placeholder="Password" required>
          </div>
          <div class="input-group">
            <label for="Date of Birth">DOB: </label>
            <input type="date" id="Date of Birth" name="Date of Birth"placeholder="Date of Birth" required>
          </div>
          <div class="input-group">
            <label for="Address">Address: </label>
            <input type="text" id="Address" name="Address"placeholder="Address" required>
          </div>
      <button type="submit" class="save-btn">Save Changes</button>
    </form>
  </div>

</body>
</html>
